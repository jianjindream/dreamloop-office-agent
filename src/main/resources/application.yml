server:
  port: 8090

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

app:
  # 工作成果默认写入文件数据库；postgres 模式连接失败会报错，不会降级为内存。
  storage:
    backend: "${APP_STORAGE_BACKEND:h2}"
    directory: "${APP_STORAGE_DIRECTORY:data/workspace}"
  llm:
    # 阿里云百炼 OpenAI 兼容接口（华北 2/北京）。
    # Token Plan 或其他地域的 Key 必须改用百炼控制台显示的配套 API Host。
    api-url: "${APP_LLM_API_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}"
    api-key: "${APP_LLM_API_KEY:}"
    model: "${APP_LLM_MODEL:qwen-plus}"
    temperature: 0.7
  embedding:
    api-url: "${APP_EMBEDDING_API_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/embeddings}"
    api-key: "${APP_EMBEDDING_API_KEY:}"
    model: "${APP_EMBEDDING_MODEL:text-embedding-v4}"
    # text-embedding-v4 支持自定义维度；必须与 rag-milvus-dim 保持一致。
    dimensions: "${APP_EMBEDDING_DIMENSIONS:1024}"
  milvus:
    host: localhost
    port: 19530
  postgres:
    host: localhost
    port: 5432
    user: aiagent
    password: aiagent123
    database: aiagent
  elasticsearch:
    addresses: http://localhost:9200
    username: elastic
    password: changeme
  kafka:
    brokers: localhost:29092
    topic: agent-events
    outbox-dir: "${APP_KAFKA_OUTBOX_DIR:data/kafka-outbox}"
    reconnect-interval-ms: 5000
    max-pending-events: 10000
  rag:
    chunk-size: 200
    chunk-overlap: 50
    # Small-to-big chunking: retrieve 200-character children, send 800-character parents to the LLM.
    parent-chunk-size: 800
    parent-chunk-overlap: 100
    # Each source retrieves 4x this many child chunks (12 -> 48); RRF keeps 12 parents before final top-k.
    candidate-parent-k: 12
    top-k: 3
    rrf-constant-k: 60
    # Milvus 使用 COSINE 语义相似度；一级加权 RRF：Milvus 0.7、ES 1.0、Neo4j 使用 app.neo4j.weight（默认 0.3）。权重设为 0 可禁用对应来源。
    semantic-weight: 0.7
    keyword-weight: 1.0
    # 关闭时优先使用 Milvus 单路语义检索；Milvus 不可用时退化到 ES。
    enable-hybrid-search: true
    # 与阿里云 text-embedding-v4 的默认输出维度保持一致。
    rag-milvus-dim: "${APP_RAG_RAG_MILVUS_DIM:1024}"
    # 先检索主 query；仅在结果不足或缺少跨路共识时扩展最多 num-queries 条。
    rewrite:
      enabled: true
      num-queries: 3
      variant-weight: 0.8
      broad-weight: 0.6
      parallelism: 2
  evaluation:
    # A synchronous benchmark run is capped to protect the serving process and LLM budget.
    max-cases: 200
  memory:
    short-term-max-turns: 12
    long-term-top-k: 3
    min-recent-turns: 5
    context-window-tokens: 32768
    reserved-output-tokens: 4096
    history-max-tokens: 8000
    summary-max-tokens: 1200
    summary-soft-turns: 10
    summary-soft-tokens: 6000
    consolidation:
      similarity-threshold: 0.80
      dedup-threshold: 0.95
      ttl-days: 30
      preference-half-life-days: 180
      general-half-life-days: 90
      tool-failure-half-life-days: 60
      recall-boost-rate: 0.05
      max-recall-boost: 0.20
      min-importance: 0.3
      trigger-interval: 10
  harness:
    max-retries: 3
    retry-delay-ms: 200
    step-timeout-ms: 5000
    max-iterations: 5
  graph:
    # 覆盖 Tavily/Bing/Google/SerpAPI 四路竞速，并为独立 RAG 节点保留并发槽位。
    max-parallel: 5
    race-timeout-ms: 30000
    # 首个合格检索结果出现后，短暂等待可能质量更高的候选。
    race-grace-ms: 150
    race-min-result-chars: 12
    enable-racing: true
  search:
    api-key: "${TAVILY_API_KEY:}"
    api-url: "https://api.tavily.com/search"
    # Microsoft Foundry/Azure OpenAI Web Search（底层由 Bing Search 提供 grounding）。
    bing:
      api-key: "${AZURE_OPENAI_API_KEY:}"
      endpoint: "${AZURE_OPENAI_ENDPOINT:}"
      model: "${AZURE_OPENAI_WEB_SEARCH_MODEL:}"
    # Google Custom Search JSON API：需要 API Key 和 Programmable Search Engine ID。
    google:
      api-key: "${GOOGLE_SEARCH_API_KEY:}"
      engine-id: "${GOOGLE_SEARCH_ENGINE_ID:}"
      api-url: "https://www.googleapis.com/customsearch/v1"
    serp-api:
      api-key: "${SERPAPI_API_KEY:}"
      api-url: "https://serpapi.com/search.json"

  # ===== 知识图谱（Neo4j，可选）=====
  neo4j:
    uri: "bolt://localhost:7687"
    user: "neo4j"
    password: "password123"
    max-hops: 2
    weight: 0.3
    enabled: true

  # ===== 沙箱执行（用于终端命令工具）=====
  sandbox:
    enabled: true
    backend: "docker"        # docker | local | mock
    image: "${APP_SANDBOX_IMAGE:alpine:3.19}"
    timeout-ms: 30000
    max-output-bytes: 65536
    memory-limit-mb: 256
    cpu-percent: 50
    max-pids: 64
    max-concurrent-executions: 4
    acquire-timeout-ms: 1000
    network-disabled: true
    readonly-rootfs: true
    # Local 会在宿主机执行命令；必须显式开启且同时启用 security.allowlist-mode。
    allow-unsafe-local-backend: false

  # ===== 命令安全校验 =====
  security:
    max-command-length: 500
    confirmation-ttl-seconds: 300
    allowlist-mode: false
    allow-private-mcp-endpoints: false
    allowlist:
      - "ls"
      - "cat"
      - "echo"
      - "pwd"
      - "date"

  # 生产环境开启后，所有 /api/* 请求必须携带 Bearer token。
  # tokens 的值格式为 userId:workspaceId；请仅通过外部配置注入真实 token。
  auth:
    enabled: false
    default-workspace: default
    tokens: {}
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
